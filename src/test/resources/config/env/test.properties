# --- Koşu sonu temizlik ---
# true: koşu bitince otomasyonun oluşturduğu eski veri setleri (önce) ve kaynaklar (sonra) silinir.
# Jenkins'te BVAKP_CLEANUP_ENABLED=true ile açılır; localde kapalı kalır.
cleanup.enabled=true
# Temizliğin çalışabileceği host (yalnızca IP/ad; http:// ve port yazılmaz). Canlı ortam ASLA eklenmemeli.
cleanup.allowed.hosts=10.161.71.30
# Yalnızca bu ön ekle başlayan adlar silinir (büyük/küçük harf duyarlı).
cleanup.name.prefix=otomasyon_
# Adındaki tarihe göre en az bu kadar saat önce oluşturulmuş kayıtlar silinir (48 = 2 gün).
cleanup.min.age.hours=120