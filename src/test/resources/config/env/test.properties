base.url=http://10.161.71.30:30180/
public.data.url=https://10.161.71.30:30183/

username=test.portaladmin

# Rol kullanıcıları. Parolalar dosyada değil, ortam değişkeninde:
# BVAKP_PASSWORD_HAZIRLAYAN, BVAKP_PASSWORD_KVKK, BVAKP_PASSWORD_YAYIN
username.hazirlayan=test.portaladmin
username.kvkk=test.portaladmin
username.yayin=test.portaladmin

# Koşu sonu temizliğin çalışabileceği host. Canlı ortam ASLA eklenmemeli.
cleanup.allowed.hosts=http://10.161.71.30:30180/

# Test ortamı kendinden imzalı sertifika kullanıyor; yalnızca bu ortamda açık.
ignore.https.errors=true


# --- Koşu sonu temizlik ---
# true: koşu bitince testlerin Açık Veri Portalında oluşturduğu kaynaklar silinir.
# Silmeye izin verilen ortamlar ortam dosyasındaki cleanup.allowed.hosts ile belirlenir.
cleanup.enabled=false
# Yalnızca bu ön ekle başlayan kaynak adları silinir (büyük/küçük harf duyarlı).
cleanup.name.prefix=otomasyon_
# Bir temizlikte en fazla silinecek kayıt sayısı.
cleanup.max.delete=200