# =====================================================================
#  Contabo ortamı (buyukverianalitigi.com) - Jenkins'in koştuğu küme
#  Seçim: mvn test "-Denv=contabo"  veya  BVAKP_ENV=contabo
#  Parolalar bu dosyaya yazılmaz: BVAKP_PASSWORD... ortam değişkenleri.
# =====================================================================

base.url=https://portal.buyukverianalitigi.com/
public.data.url=https://bvakp-od-portal.buyukverianalitigi.com/

username=test.portaladmin

# Rol kullanıcıları. Parolalar dosyada değil, ortam değişkeninde:
# BVAKP_PASSWORD_HAZIRLAYAN, BVAKP_PASSWORD_KVKK, BVAKP_PASSWORD_YAYIN, BVAKP_PASSWORD_TEMIZLIK
# (rolün parolası tanımlı değilse BVAKP_PASSWORD kullanılır)
username.hazirlayan=test.portaladmin
username.kvkk=test.portaladmin
username.yayin=test.portaladmin
username.temizlik=test.portaladmin

# Açık portal (CKAN) kullanıcıları. Parolalar ortam değişkeninde:
# BVAKP_PORTAL_PASSWORD_TALEP, BVAKP_PORTAL_PASSWORD_ONAY
portal.username.talep=ckan_admin
portal.username.onay=ckan_admin

# --- Test verisi (Kaynak Ekle / veri seti) ---
testdata.kaynak.sema=kaynak_veri
testdata.kaynak.tablo=altyapi_genel_verileri
testdata.maskelenecek.kolon=bolge_mudurlugu

# Boş bırakılırsa listedeki ilk seçenek seçilir.
testdata.sorumlu.birim=İşletme Dairesi Başkanlığı
testdata.kategori=Altyapı & Şebeke
testdata.kullanim.lisansi=TCDD Taşımacılık Açık Veri Lisansı

# Boş bırakılırsa mevcut değerden farklı ilk seçenek seçilir.
testdata.duzenleme.sorumlu.birim=Yol Dairesi Başkanlığı
testdata.duzenleme.kategori=Filo & Araçlar


# Let's Encrypt sertifikası geçerli; HTTPS hataları yok sayılmaz.
ignore.https.errors=false


# --- Koşu sonu temizlik ---
# Jenkins'te BVAKP_CLEANUP_ENABLED=true ile açılır; localde kapalı kalır.
cleanup.enabled=true
# base.url host'u bu listede olmalı. Canlı ortam ASLA eklenmemeli.
cleanup.allowed.hosts=portal.buyukverianalitigi.com
cleanup.name.prefix=otomasyon_
cleanup.min.age.hours=120

# Açık portal (CKAN): true = rol başına bir kez giriş yapılır, oturum sonraki testlerde kullanılır.
# false = her test kendi girişini yapar (daha yavaş; portalın giriş sınırına takılabilir).
public.portal.auth.state.reuse=false