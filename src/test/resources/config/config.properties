# =====================================================================
#  BVA KP Otomasyon - Ortak ayarlar (bütün ortamlar)
#
#  Ortama özel ayarlar (adresler, kullanıcı, test verisi) : env/<ortam>.properties
#  Kişisel ayarlar (Git'e girmez)                         : config.local.properties
#  Parolalar : BVAKP_PASSWORD* / BVAKP_PORTAL_PASSWORD_* ortam değişkenleri
#              (Jenkins'te Credentials'tan gelir; dosyaya yazılmaz)
#  Mail ayarları : .env.mail (Git'e girmez) veya MAIL_* ortam değişkenleri
#
#  Öncelik: -D > ortam değişkeni (BVAKP_...) > config.local > env/<ortam> > bu dosya
#  Ortam seçimi: mvn test "-Denv=dev"  veya  BVAKP_ENV=dev   (verilmezse test)
# =====================================================================


# --- Tarayıcı ---
# browser: chromium / chrome / firefox / webkit / edge
browser=chromium
# headless: true = tarayıcı görünmeden çalışır, false = ekranda açılır
# Jenkins'te BVAKP_HEADLESS=true ile ezilir.
headless=false
# Tarayıcı penceresi ve video boyutu (piksel)
viewport.width=1366
viewport.height=768

# Kırılan test kaç kez tekrar denensin. 0 = tekrar deneme yok.
# Jenkins'te BVAKP_TEST_RETRY_COUNT ile ayarlanır.
test.retry.count=1

# --- Test kanıtları ---
# off               : hiç kaydedilmez
# on                : her test için saklanır
# retain-on-failure : sadece hatalı testler için saklanır (önerilen)
# DİKKAT: trace, girilen değerleri (parolalar dahil) açık metin saklar; trace dosyalarını paylaşmayın.
# Jenkins'te ikisi de kapalıdır (BVAKP_TRACE_MODE / BVAKP_VIDEO_MODE = off).
trace.mode=retain-on-failure
video.mode=retain-on-failure


# --- Allure raporu ---
# Kaydedilen video/trace Allure raporuna eklensin mi?
# false ise dosyalar yine reports/kosular arşivinde durur, sadece rapora eklenmez.
allure.attach.video=false
allure.attach.trace=true
# Koşu sonunda Allure HTML raporu otomatik üretilsin mi? (Allure CLI gerekir)
# Jenkins'te false; rapor Jenkins Allure eklentisiyle üretilir.
allure.report.auto.generate=true
# Rapor üretimi için en fazla bekleme süresi (saniye, en az 30)
allure.report.timeout.seconds=300
# Saklanacak koşu sayısı; eskiler silinir (0 = hiç silme)
kosu.saklama.adedi=20


# --- Hata takibi ---
# true: aynı test üst üste 5 kez hatalı olursa günde bir bilgilendirme maili gider.
# Kapalı: sonuçlar her koşudaki rapor mailiyle takip ediliyor (Jenkins'te de false).
failure.tracking.enabled=false


# --- Oturum ---
# false: her test kendi girişini yapar (paralel koşu için gerekli)
# true : kayıtlı oturum dosyası kullanılır (yalnızca tek test / sıralı koşuda: -Dauth.state.reuse=true)
auth.state.reuse=true