# =====================================================================
#  BVA KP Otomasyon - Ortak ayarlar (bütün ortamlar)
#
#  Ortama özel ayarlar (adresler, kullanıcı) : ortam/<ortam>.properties
#  Kişisel ayarlar (Git'e girmez)             : config.local.properties
#  Parola                                     : BVAKP_PASSWORD ortam değişkeni
#
#  Ortama özel ayarlar (adresler, kullanıcı) : env/<ortam>.properties
#  Öncelik: -D > ortam değişkeni (BVAKP_...) > config.local > env/<ortam> > bu dosya
#  Ortam seçimi: mvn test "-Denv=test"   (verilmezse test)
# =====================================================================


# --- Tarayıcı ---
# browser: chromium / firefox / webkit
browser=chromium
# headless: true = tarayıcı görünmeden çalışır (CI için), false = ekranda açılır
headless=false
# Tarayıcı penceresi ve video boyutu (piksel)
viewport.width=1280
viewport.height=720

# Kırılan test kaç kez tekrar denensin. 0 = tekrar deneme yok.
# Jenkins'te BVAKP_TEST_RETRY_COUNT=1 ile açılır.
test.retry.count=0

# --- Test kanıtları ---
# off               : hiç kaydedilmez
# on                : her test için saklanır
# retain-on-failure : sadece hatalı testler için saklanır (önerilen)
trace.mode=retain-on-failure
video.mode=retain-on-failure


# --- Allure raporu ---
# Kaydedilen video/trace Allure raporuna eklensin mi?
# false ise dosyalar yine reports/kosular arşivinde durur, sadece rapora eklenmez.
allure.attach.video=false
allure.attach.trace=true
# Koşu sonunda Allure HTML raporu otomatik üretilsin mi? (Windows + Allure CLI gerekir)
allure.report.auto.generate=true
# Rapor üretimi için en fazla bekleme süresi (saniye, en az 30)
allure.report.timeout.seconds=300
# Saklanacak koşu sayısı; eskiler silinir (0 = hiç silme)
kosu.saklama.adedi=20


# --- Hata takibi ve mail ---
# true: aynı test üst üste 5 kez hatalı olursa günde bir bilgilendirme maili gider.
# Lokalde false bırakın; CI'da açılması önerilir.
failure.tracking.enabled=false



# --- Oturum ---
# false: her test kendi girişini yapar (paralel koşu için gerekli)
# true : kayıtlı oturum dosyası kullanılır (yalnızca tek test / sıralı koşuda: -Dauth.state.reuse=true)
auth.state.reuse=false