# =====================================================================
#  BVA KP Otomasyon - Ayarlar
#
#  Her ayar çalıştırma anında -D ile ezilebilir:
#    mvn test "-Dheadless=true"
#  IntelliJ: Run > Edit Configurations > VM options
# =====================================================================


# --- Ortam ---
base.url=https://portal.buyukverianalitigi.com/login
public.data.url=https://bvakp-od-portal.buyukverianalitigi.com/

# Test kullanıcısı
# NOT: Şifre ileride ortam değişkenine taşınacak; Git'e gerçek şifre yazmayın.
username=test.portaladmin
password=test.portaladmin


# --- Tarayıcı ---
# browser: chromium / firefox / webkit
browser=chromium
# headless: true = tarayıcı görünmeden çalışır (CI için), false = ekranda açılır
headless=true
# Tarayıcı penceresi ve video boyutu (piksel)
viewport.width=1280
viewport.height=720


# --- Test kanıtları ---
# off               : hiç kaydedilmez
# on                : her test için saklanır
# retain-on-failure : sadece hatalı testler için saklanır (önerilen)
trace.mode=retain-on-failure
video.mode=retain-on-failure


# --- Allure raporu ---
# Kaydedilen video/trace Allure raporuna eklensin mi?
# false ise dosyalar yine reports/allure-runs arşivinde durur, sadece rapora eklenmez.
allure.attach.video=false
allure.attach.trace=true
# Koşu sonunda Allure HTML raporu otomatik üretilsin mi? (Windows + Allure CLI gerekir)
allure.report.auto.generate=true
# Rapor üretimi için en fazla bekleme süresi (saniye, en az 30)
allure.report.timeout.seconds=300


# --- Hata takibi ve mail ---
# true: aynı test üst üste 5 kez hatalı olursa günde bir bilgilendirme maili gider.
# Lokalde false bırakın; CI'da açılması önerilir.
failure.tracking.enabled=false

# --- Koşu sonu temizlik ---
# true: koşu bitince testlerin Açık Veri Portalında oluşturduğu kaynaklar silinir.
cleanup.enabled=false
# Silmeye izin verilen ortamlar (base.url adresi). Canlı ortam ASLA eklenmemeli.
cleanup.allowed.hosts=portal.buyukverianalitigi.com
# Yalnızca bu ön ekle başlayan kaynak adları silinir (büyük/küçük harf duyarlı).
cleanup.name.prefix=otomasyon_
# Bir temizlikte en fazla silinecek kayıt sayısı.
cleanup.max.delete=200

# --- Oturum ---
# true : kayıtlı oturum dosyası kullanılır (hızlı; tek tek veya sıralı koşu için)
# false: her test kendi girişini yapar
auth.state.reuse=true